<div class="container">
    <div class="row">
       <div class="col-4">
               <img [src]="productData?.productImgURL" class="img-fluid">
       </div>

       <div>
       <h1>{{productData?.productName}}</h1>
       <p>{{productData?.productDetails}}</p>
       </div>

     </div>


      <div class="d-flex justify-content-center">
      <button
        class="btn btn-light"
        (click)="goPrev()"

      >
        <i class="fa-solid fa-angles-left text-primary"></i>
      </button>

      <button
        class="btn btn-light"
        (click)="goNext()"
          
      >
        <i class="fa-solid fa-angles-right"></i>
      </button>
    </div>

    

      
       <button class="btn btn-danger" (click)="goBack()">go back</button>

       
   
</div>
